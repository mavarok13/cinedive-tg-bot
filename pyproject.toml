[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cinedive-tg-bot"
version = "0.1.0"
description = "CineDive Telegram bot for movie and TV show recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = "Proprietary"
authors = [{ name = "Samuil Makarov" }]
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["cinedive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
